name: Verify go-chu-ver2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tools
        run: |
          python -m py_compile tools/render_google_tts.py
          python -m py_compile tools/vendor_twemoji.py
          python -m py_compile tools/verify_repository.py
          python -m py_compile tools/check_deploy_ready.py
          python -m py_compile tools/verify_startup_loading.py
          python -m py_compile tools/verify_easy_entry.py
          python -m py_compile tools/verify_easy_transition.py
          python -m py_compile tools/verify_optional_runtime.py

      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Static repository verification
        run: python tools/verify_repository.py

      - name: Startup loading verification
        run: python tools/verify_startup_loading.py

      - name: Easy entry fast-path verification
        run: python tools/verify_easy_entry.py

      - name: Easy transition gate verification
        run: python tools/verify_easy_transition.py

      - name: Optional runtime split verification
        run: python tools/verify_optional_runtime.py

      - name: Deploy readiness report
        run: python tools/check_deploy_ready.py

      - name: Twemoji dry run
        run: python tools/vendor_twemoji.py --dry-run

      - name: Google TTS dry run
        run: python tools/render_google_tts.py --dry-run --limit 5
