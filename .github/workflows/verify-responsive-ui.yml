name: Verify responsive UI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify responsive UI contract
        run: python tools/verify_responsive_ui.py

      - name: Check root JavaScript syntax
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
